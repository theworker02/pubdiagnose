name: pubdiagnose
description: >
  Diagnose Dart dependencies: why packages are installed, what blocks
  upgrades, and which constraints conflict. CLI: pubdoctor.
version: 2.0.0
repository: https://github.com/theworker02/pubdiagnose
homepage: https://github.com/theworker02/pubdiagnose
issue_tracker: https://github.com/theworker02/pubdiagnose/issues
documentation: https://github.com/theworker02/pubdiagnose/tree/main/docs

topics:
  - dependencies
  - tooling
  - cli
  - diagnostics
  - pub

environment:
  sdk: ^3.5.0

# Package name is pubdiagnose; CLI binary stays `pubdoctor`.
executables:
  pubdoctor:

dependencies:
  args: ^2.5.0
  collection: ^1.18.0
  http: ^1.2.0
  path: ^1.9.0
  pub_semver: ^2.1.4
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.6
